version: 1
applications:
  - appRoot: ui
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Garantiza que el runtime SSR vea las vars (y sin espacios accidentales)
            - env | grep -E "^(LUPIA_API_URL|NEXT_PUBLIC_)" | sed "s/ *$//" >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
